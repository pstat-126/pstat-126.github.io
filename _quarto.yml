project:
  type: website
  output-dir: docs
  render:
    - "**/*.qmd"
  resources:
    - late_pass_questionnaire/
  post-render:
    - scripts/copy_rmds.sh

website:
  title: "PSTAT 126"
  description: "Regression Analysis — University of California, Santa Barbara"

  navbar:
    background: "#003660"
    foreground: white
    collapse-below: lg
    left:
      - text: "Syllabus"
        href: course-syllabus.qmd
      - text: "Lecture Materials"
        href: schedule.qmd
      - text: "Assignments"
        href: assignments.qmd
      - text: "Labs"
        href: labs.qmd
    right:
      - text: "Gradescope"
        href: https://www.gradescope.com
        target: _blank
      

  sidebar:
    style: docked
    background: light
    collapse-level: 1
    contents:
      - section: "Course Information"
        contents:
          - text: "Syllabus"
            href: course-syllabus.qmd
          - text: "Class Calendar"
            href: class-calendar.qmd
          - text: "Office Hours"
            href: office-hours.qmd
      - text: "Lecture Materials"
        href: schedule.qmd
      - section: "Assignments"
        contents:
          - text: "All Assignments"
            href: assignments.qmd
          - text: "HW 1"
            href: hw/hw-01.qmd
          - text: "HW 2"
            href: hw/hw-02.qmd
          - text: "HW 3"
            href: hw/hw-03.qmd
          - text: "HW 4"
            href: hw/hw-04.qmd
      - section: "Labs"
        contents:
          - text: "All Labs"
            href: labs.qmd
          - text: "Lab 1"
            href: labs/lab-01.qmd
          - text: "Lab 2"
            href: labs/lab-02.qmd
          - text: "Lab 3"
            href: labs/lab-03.qmd
          - text: "Lab 4"
            href: labs/lab-04.qmd
      - section: "Exams"
        contents:
          - text: "Midterm"
            href: exams/midterm-formula-sheet.qmd
          - text: "Final"
            href: exams/final.qmd

  page-footer:
    left: "© 2026, PSTAT 126 — University of California, Santa Barbara"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    toc-depth: 3
    link-external-newpage: true
    link-external-icon: true
